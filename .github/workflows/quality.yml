name: LogiSearch quality
on:
  pull_request:
    branches: [main]
  push:
    branches: [main, security/server-side-provider-gateway]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: node --test tests/*.test.mjs
